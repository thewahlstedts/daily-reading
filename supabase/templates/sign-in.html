<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f7f3ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#2a2622;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f3ec;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fffdf9;border:1px solid #e6dfd3;border-radius:16px;padding:32px 28px;">
        <tr><td>
          <p style="margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7a7166;">Daily Reading</p>
          <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;">Your sign-in code</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">Enter this code in the app to sign in:</p>
          <p style="margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:.3em;color:#8a5a2b;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</p>
          <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">Or, on this device, tap the button:</p>
          <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8a5a2b;color:#fffdf9;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px;">Sign in to Daily Reading</a></p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#7a7166;">The code expires in an hour. If you didn't ask to sign in, you can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
